name: Materialize README overview image

on:
  push:
    branches: [main]
    paths:
      - 'assets/overview.webp.base64.txt'
      - '.github/workflows/materialize-overview.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode overview image
        shell: bash
        run: |
          if [ -f assets/overview.webp.base64.txt ]; then
            base64 -d assets/overview.webp.base64.txt > assets/overview.webp
            rm -f assets/overview.webp.base64.txt assets/overview-note.md
          fi

      - name: Commit binary asset
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
          else
            git commit -m 'assets: add README overview image'
            git push origin HEAD:main
          fi
