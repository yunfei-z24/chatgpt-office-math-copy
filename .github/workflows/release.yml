# Release workflow for the current tested public build.
name: Publish v1.2.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: v1.2.0
      ZIP: chatgpt-office-math-copy-v1.2.0.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifest version and required runtime
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          with open('manifest.json', encoding='utf-8') as f:
              data = json.load(f)
          assert data['version'] == '1.2.0', data['version']
          for p in ['content-v120.js', 'vendor/katex.min.js', 'vendor/KATEX-LICENSE.txt', 'style.css']:
              assert pathlib.Path(p).is_file(), p
          print('manifest version:', data['version'])
          PY

      - name: Build extension ZIP
        shell: bash
        run: |
          rm -f "$ZIP"
          zip -r "$ZIP" \
            manifest.json \
            content-v120.js \
            vendor/katex.min.js \
            vendor/KATEX-LICENSE.txt \
            style.css \
            LICENSE \
            README.md \
            README.zh-CN.md \
            PRIVACY.md \
            CHANGELOG.md
          unzip -l "$ZIP"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" \
              --target "$GITHUB_SHA" \
              --title "v1.2.0 — Current ChatGPT formula-container support" \
              --notes-file RELEASE_NOTES.md
          fi
